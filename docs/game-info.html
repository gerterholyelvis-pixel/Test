*{box-sizing:border-box}
html{scroll-padding-top:120px}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 var(--body);padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));padding-block:20px 56px}
main{max-width:1240px;margin:0 auto}
header{display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px;margin-bottom:12px}
h1{font:700 40px/1 var(--disp);letter-spacing:.02em;text-transform:uppercase;margin:0;text-wrap:balance}
.stamp{color:var(--mute);font:12px var(--mono)}
.hdr-r{margin-left:auto;display:flex;gap:8px;align-items:center;flex:1 1 280px;justify-content:flex-end}
#gq{flex:1 1 220px;max-width:440px}
button,input{font:inherit;color:inherit}
input[type=search]{font:15px var(--body);background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:4px;padding:7px 10px;min-width:min(200px,100%)}
.btn{font:500 14px var(--disp);letter-spacing:.06em;text-transform:uppercase;background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:4px;padding:6px 10px;cursor:pointer}
nav{display:flex;flex-wrap:wrap;gap:2px 4px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:6px 0;border-bottom:1px solid var(--line);z-index:3}
nav a{font:500 17px var(--disp);letter-spacing:.04em;text-transform:uppercase;color:var(--mute);border-bottom:3px solid transparent;padding:5px 10px;text-decoration:none}
nav a b{font:400 11px var(--mono);margin-left:5px}
nav a[aria-selected=true]{color:var(--fg);border-bottom-color:var(--accent)}
a{color:var(--link)}
a:focus-visible,button:focus-visible,input:focus-visible,th:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.note{color:var(--mute);font-size:13px}
.lead{max-width:80ch;margin:14px 0 4px}
.blk{margin-top:22px}
.blk h2{font:700 22px var(--disp);letter-spacing:.05em;text-transform:uppercase;margin:0 0 6px}
.bar-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:0 0 8px}
.wrap{overflow-x:auto;border:1px solid var(--line);border-radius:4px;background:var(--bg)}
table{border-collapse:collapse;width:100%;min-width:560px}
th,td{padding:6px 10px;text-align:left;white-space:nowrap;border-bottom:1px solid var(--line);vertical-align:top}
td.wrapc{white-space:normal;min-width:260px;color:var(--mute)}
td.wrapc.long{min-width:340px}
th{font:500 14px var(--disp);letter-spacing:.06em;text-transform:uppercase;background:var(--panel);cursor:pointer;user-select:none;position:sticky;top:0}
th[aria-sort=ascending]::after{content:' \25B2';font-size:10px}th[aria-sort=descending]::after{content:' \25BC';font-size:10px}
td.n,th.n{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
td.name{font:500 17px var(--disp);letter-spacing:.02em}
tr:last-child td{border-bottom:0}
tr.hit td{background:var(--accent-bg);transition:background 2s}
.tier{font:500 12px var(--mono);text-transform:uppercase;letter-spacing:.04em}
.t0{color:var(--t0)}.t1{color:var(--t1)}.t2{color:var(--t2)}.t3{color:var(--t3)}.t4{color:var(--t4)}.t5{color:var(--t5)}
.bars{display:inline-block;height:8px;background:var(--bar);border-radius:1px;vertical-align:middle;margin-right:6px;min-width:1px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:16px;margin-top:18px}
.card{border:1px solid var(--line);border-radius:4px;padding:12px 14px;background:var(--panel);min-width:0}
.card h2{font:700 20px var(--disp);letter-spacing:.05em;text-transform:uppercase;margin:0 0 6px}
.kv{display:flex;justify-content:space-between;gap:14px;padding:3px 0;border-bottom:1px dotted var(--line)}
.kv span:first-child{color:var(--fg)}
.kv span:last-child{text-align:right;color:var(--mute);min-width:0;overflow-wrap:anywhere}
.kv:last-child{border-bottom:0}
#res{margin-top:14px}
#res h3{font:700 18px var(--disp);letter-spacing:.05em;text-transform:uppercase;margin:16px 0 4px}
.hitrow{display:block;padding:6px 8px;border-bottom:1px solid var(--line);text-decoration:none;color:var(--fg)}
.hitrow:hover{background:var(--panel)}
.hitrow b{font:500 17px var(--disp)}
.hitrow span{color:var(--mute);font-size:13px;display:block;overflow-wrap:anywhere}
mark{background:var(--accent-bg);color:inherit;border-radius:2px}
@media (max-width:640px){h1{font-size:32px}nav a{padding:5px 7px;font-size:15px}.hdr-r{justify-content:stretch}#gq{max-width:none}}
@media (prefers-reduced-motion:reduce){tr.hit td{transition:none}}

ern breaks your sequence. Every third success, once a match, can grant a free perk (Remembrance).","yield":"5 knowledge (+1 per step above 3) per success, 3 successes per goblin per round; Remembrance once per match","knowMin":15,"makes":[],"anchors":"trunk C, lanterns NE,NW,SE,SW","npc":"","nums":"memPer 700; memInput 12000 (12 s); memCd 6000 (6 s); memCap 3; memKnow 5; memMax 7; memRemember 10"},{"id":"oak","name":"Hollow Oak","weight":{"v":4,"bar":25},"present":{"v":19.2,"bar":70},"what":"Stand in the nook for 3 s to become the Warden: you and the room are hidden from every map, and a secret whispers to you every 8 s for +2 knowledge (6 a round, only while you look around). Your first hit on a newcomer does +50%. A hit ejects you.","yield":"2 knowledge per whisper every 8 s, 6 per round, only while looking around","knowMin":12,"makes":[],"anchors":"nook nook","npc":"","nums":"oakHold 3000 (3 s); oakWhisper 8000 (8 s); oakKnow 2; oakCap 6; oakR 0.9; oakLook 30; oakAmbush 1.5"},{"id":"elder","name":"Elder Tree","weight":{"v":2,"bar":25},"present":{"v":9.8,"bar":70},"what":"Three root-stones need 20 s / 30 s / 30 s of channelling (waking 1 / 2 / 3). When all are lit the Elder wakes (5 s rumble) and drops a seed; the first to take it (2 s) wins 25 / 12 / 6 knowledge and a tier 3 / 2 / 1+ item, outside the tree cap. A Rootling climbs out every 20 s (up to 2). 3 wakings a match.","yield":"a waking pays 25 / 12 / 6 knowledge (exempt from the tree cap) plus an item to the first goblin at the seed; 3 wakings per match","knowMin":0,"makes":[],"anchors":"stones NE,NW,SE, seed C","npc":"Rootling (hp 40, dmg 8)","nums":"stoneMs 20000 (20 s) / 30000 (30 s) / 30000 (30 s); seedMs 2000 (2 s); rumbleMs 5000 (5 s); rootEvery 20000 (20 s); rootMax 2; elderKnow 25 / 12 / 6; elderTier 3 / 2 / 1; elderWakes 3"}]},{"t":"table","id":"blessings","title":"Thorn Shrine blessings","note":"Bonus by blessing tier. Lasts until the end of the next round.","cols":[{"k":"name","label":"Blessing",  / 6"},{"id":"tc-elderTier","tree":{"v":"Elder Tree","href":"#trees/elder"},"key":"elderTier","value":"3 / 2 / 1"},{"id":"tc-elderWakes","tree":{"v":"Elder Tree","href":"#trees/elder"},"key":"elderWakes","value":"3"}]}],"vault":[{"t":"p","text":"Four vaultbreaker rooms stand in front of the vault doors, all four in every match; their positions shuffle every round. Each makes votes toward opening the vault and a token that helps the next heist. The ring: Ram, Locksmith, Counting House, Keystone, back to the Ram."},{"t":"table","id":"vbs","title":"The 4 vaultbreakers","note":"","cols":[{"k":"name","label":"Heist","num":0,"cls":"name"},{"k":"role","label":"Style","num":0,"cls":""},{"k":"what","label":"What it does","num":0,"cls":"wrapc"},{"k":"vote","label":"Vote contribution","num":0,"cls":"wrapc"},{"k":"token","label":"Makes","num":0,"cls":""},{"k":"tokenUse","label":"Token use","num":0,"cls":"wrapc"}],"rows":[{"id":"ram","name":"Battering Ram","role":"Siege: loud, co-op, physical","what":"Two crank handles wind the winch with timing presses (up to 6 notches, so a pair winds twice as fast). Release at the lever: the strike adds 3 breach per notch to the vault door. 50 is Cracked, 100 is Broken; breach decays by 20 each round boundary. Anyone in the lane takes 25. Defenders can slack the winch (1.5 s) or raise a barricade (60 HP; 2 metal or 10 elixir). In sudden death it becomes Quake: a full strike knocks everyone off the dais, freezing claims 3 s (15 s cooldown).","vote":"A door at breach 50+ gives any room picking it +1 vote; at 100 the door opens at the round end whatever the votes","token":{"v":"Iron Wedge","href":"#items/x:ironwedge"},"tokenUse":"Locksmith grindstone: a free Key Blank","nums":"NOTCH_MAX 6; WINCH_PER 700 / 900; WINCH_WIN 0.3; SWING_MS 1200 (1.2 s); PER_NOTCH 3; STRIKE_POWER 8; LANE_DMG 25; SLACK_MS 1500 (1.5 s); HANDLE_IDLE 6000 (6 s); BAR_HP 60; BAR_MS 1500 (1.5 s); BAR_CD 20000 (20 s); BAR_METAL 2; BAR_ELIXIR 10; CHOP 10; CHOP_CD 700; QUAKE_CD 15000 (15 s); QUAKE_FREEZE 3000; CRACKED 50; BROKEN 100; BREACH_DECAY 20"},{"id":"locksmith","name":"Locksmith","role":"Stealth: precision, quiet","what":"Grind a Key Blank (3 s), set 5 pins in order with timing presses, then cut (3 s) a Vault Lockpick, a Skeleton Key or fence the cut for gold and knowledge. Misses add 18 noise, jiggling 25; noise decays 3/s. At 50 the room shows on every minimap (until 40); at 100 the lock alarm releases Vault Wardens (up to 4). In sudden death the cut makes a Crown Seal.","vote":"Vault Lockpick: +1 vote in a room whose pick is a vault door","token":{"v":"Skeleton Key","href":"#items/x:skeleton"},"tokenUse":"Counting House strongbox: a fast silent robbery","nums":"PINS 5; PIN_PER 900 / 1200 (1.2 s); PIN_WIN 0.18; NOISE_MISS 18; NOISE_JIGGLE 25; NOISE_DECAY 3; GRIND_MS 3000 (3 s); CUT_MS 3000 (3 s); JIGGLE_CD 1500 (1.5 s); LOUD_ON 50; LOUD_OFF 40; ALARM 100; WARDEN_MAX 4"},{"id":"counting","name":"Counting House","role":"Economy: vote market and a robbery","what":"Buy Writs at the desk, each +1 weight on this room's pick: 20 / 30 / 40 gold, rising. A Counter-writ costs 1.5x and cancels one. The strongbox collects payments, 50% of every panel bribe in the arena and 3 gold per 5 s (cap 300). Rob it in 6 s (loud, 15 s on every minimap) or 1.5 s silently with a Skeleton Key: coin sacks of 40 gold, up to 4, carried slowly. A box of 40+ also yields Gold Leaf. In sudden death the desk sells bounties on the top claimant (30, +15 each).","vote":"Each net writ (writs minus counter-writs) is +1 vote for its room","token":{"v":"Gold Leaf","href":"#items/x:goldleaf"},"tokenUse":"Keystone altar: lights the next 2 stones","nums":"WRIT 20 / 30 / 40; SACK 40; SACKS_MAX 4; ROB_MS 6000 (6 s); ROB_KEY_MS 1500 (1.5 s); LOUD_MS 15000 (15 s); INTEREST 3; INTEREST_MS 5000 (5 s); BOX_CAP 300; BRIBE_SHARE 0.5; BOUNTY 30; BOUNTY_STEP 15; GOLDLEAF_MIN 40"},{"id":"keystone","name":"Keystone","role":"Ritual: an ordered circuit of flames","what":"Light the rune stones in the order the socket shows (2 s each, within 8 s of the last; a wrong stone is a 8 damage backlash and the circuit goes dark). Stones burn 35 s; anyone can feed one (1 s) or snuff one (1.5 s). Armed at the tally = extra vote. Resonance at 30 / 60 / 90 raises wisps (max 3) that snuff stones. Gold Leaf at the altar lights the next two. Sudden death: Ward slows the top claimant's gains to 50%.","vote":"Armed at the tally: +1 vote (so one pick counts 2)","token":{"v":"Rune Charge","href":"#items/x:runecharge"},"tokenUse":"Ram lever: the next strike does double breach","nums":"STONE_BURN 35000 (35 s); STONE_CHAIN 8000 (8 s); LIGHT_MS 2000 (2 s); FEED_MS 1000 (1 s); SNUFF_MS 1500 (1.5 s); OFFER_MS 1000 (1 s); BACKLASH 8; WISP_SNUFF_MS 2000 (2 s); RES_THR 30 / 60 / 90; WISP_MAX 3"}]},{"t":"table","id":"vbx","title":"Vaultbreaker stations","note":"Four more stations in every vaultbreaker room beside the main heist; they move with the room type. Machines reset at the re-key, items and IOUs stay. All station knowledge shares a cap of 12 a round.","cols":[{"k":"room","label":"Room","num":0,"cls":""},{"k":"name","label":"Station","num":0,"cls":"name"},{"k":"what","label":"What it does","num":0,"cls":"wrapc"},{"k":"reward","label":"Reward","num":0,"cls":""},{"k":"risk","label":"Risk","num":0,"cls":""}],"rows":[{"id":"vbx-0","room":"Battering Ram","name":"Smithy","what":"Forge a ram head (3 metal, 3.5 s): the next strike hits 20% harder (2 at most, one dulls per strike). Repair the winch (1 metal): every strike wears it and narrows the winch window.","reward":"stronger strikes","risk":"metal"},{"id":"vbx-1","room":"Battering Ram","name":"Siege tower","what":"Climb it (3 s): every goblin shows on your map for 6 s and you learn who holds the vault.","reward":"intel, +1 knowledge","risk":"the vault is told it is watched"},{"id":"vbx-2","room":"Battering Ram","name":"Barricade workshop","what":"Saw planks (2 wood, up to 3 stocked): a plank sets a barricade at the lane for nothing more, or adds 30 HP to one (90 at most). Anyone can smash the stock. A supply crate lands here now and then.","reward":"cheap defence, parts","risk":"sabotage"},{"id":"vbx-3","room":"Battering Ram","name":"War drum","what":"Drum in rhythm (timing presses): each hit adds 5% to the next strike (up to 5); a miss loses 2. Head and drum add 50% at most.","reward":"stronger strikes","risk":"a full chant is announced to everyone"},{"id":"vbx-4","room":"Locksmith","name":"Key bench","what":"Three precise cuts turn a Key Blank into a Skeleton Key (1 a round, shared with the lock).","reward":"Skeleton Key","risk":"a slip is +10 noise"},{"id":"vbx-5","room":"Locksmith","name":"Practice board","what":"Set 5 pins in a row, silently: Steady Hands, the pin windows are 35% wider for the round.","reward":"easier picks, +1 knowledge","risk":"time"},{"id":"vbx-6","room":"Locksmith","name":"Felt table","what":"Wrap the tools (1 cloth): all noise in the room is halved for 40 s. Anyone can strip it.","reward":"quiet","risk":"sabotage"},{"id":"vbx-7","room":"Locksmith","name":"Master safe","what":"Turn 3 dials of 6; a click tells only you a dial is right. Open: 30 gold, 2 knowledge and a Key Blank (1 a goblin, 2 a round). During the shift change noise and gold double.","reward":"gold, knowledge, a blank","risk":"+4 noise a turn"},{"id":"vbx-8","room":"Counting House","name":"Coin belt","what":"Sort coins with timing presses: every 5 pay 4 gold (40 a round). The rush doubles wages for 12 s.","reward":"steady gold","risk":"time"},{"id":"vbx-9","room":"Counting House","name":"Auction block","what":"Put an item up; others bid in steps of 10. 30 s, a late bid extends it. The house takes 10%.","reward":"trade between goblins","risk":"outbid"},{"id":"vbx-10","room":"Counting House","name":"Ledger","what":"Read it (5 gold): who bribed, who bought writs, who owes whom this round, and who read it before you.","reward":"intel, +1 knowledge","risk":"your name goes in it"},{"id":"vbx-11","room":"Counting House","name":"Vault of IOUs","what":"Borrow 40 gold from the strongbox, repay 50 by the end of the next round or it is taken (and grows 20%). Buy a house note for 40: you collect it.","reward":"gold now, or profit","risk":"debt"},{"id":"vbx-12","room":"Keystone","name":"Carving altar","what":"Carve a Rune Charge in 4 strokes (1 metal, 1 bone); 1 a round.","reward":"Rune Charge","risk":"a slip is +6 resonance"},{"id":"vbx-13","room":"Keystone","name":"Ritual circle","what":"The plates show an order for 3 s; step on them in that order. Attuned: lighting takes 1.2 s and feeding 0.6 s this round.","reward":"faster circuits, +2 knowledge","risk":"a wrong step is 5 damage"},{"id":"vbx-14","room":"Keystone","name":"Offering bowl","what":"Offer gear for knowledge by tier (2 / 3 / 4 / 5), 2 a round; a Rune Charge or Gold Leaf buys a vision of the next re-key.","reward":"knowledge, intel","risk":"the item"},{"id":"vbx-15","room":"Keystone","name":"Ley node","what":"Hold it alone: every 8 s every burning stone gains 6 s and resonance calms. The surge doubles it.","reward":"longer flames, knowledge","risk":"standing in the open"}]},{"t":"table","id":"vbnums","title":"Vaultbreaker tuning numbers","note":"","cols":[{"k":"type","label":"Heist","num":0,"cls":"name"},{"k":"key","label":"Constant","num":0,"cls":""},{"k":"value","label":"Value","num":0,"cls":""}],"rows":[{"id":"vc-ramNOTCH_MAX","type":{"v":"Battering Ram","href":"#vault/ram"},"key":"NOTCH_MAX","value":"6"},{"id":"vc-ramWINCH_PER","type":{"v":"Battering Ram","href":"#vault/ram"},"key":"WINCH_PER","value":"700 / 900"},{"id":"vc-ramWINCH_WIN","type":{"v":"Battering Ram","href":"#vault/ram"},"key":"WINCH_WIN","value":"0.3"},{"id":"vc-ramSWING_MS","type":{"v":"Battering Ram","href":"#vault/ram"},"key":"SWING_MS","value":"1200 (1.2 s)"},{"id":"vc-ramPER_NOTCH","type":{"v":"Battering Ram","href":"#vault/ram"},"key":"PER_NOTCH","value":"3"},{"id":"vc-ramSTRIKE_POWER","type":{"v":"Battering Ram","href":"#vault/ram"} om drop chance. How often each tier drops at each source is the Rarity tab. The tables below are computed from the live drop pools."},{"t":"table","id":"tierbands","title":"Tier bands","note":"","cols":[{"k":"tier","label":"Tier","num":0,"cls":""},{"k":"band","label":"Drop chance band","num":0,"cls":""},{"k":"nW","label":"Weapons","num":1,"cls":""},{"k":"pW","label":"Of weapon drops %","num":1,"cls":""},{"k":"nA","label":"Armour","num":1,"cls":""},{"k":"pA","label":"Of armour drops %","num":1,"cls":""}],"rows":[{"id":"tier-common","tier":{"v":"common","cls":"t0","sort":0},"nW":0,"pW":{"v":0,"bar":60},"nA":0,"pA":{"v":0,"bar":60},"band":"crafted only"},{"id":"tier-uncommon","tier":{"v":"uncommon","cls":"t1","sort":1},"nW":10,"pW":{"v":45.21,"bar":60},"nA":9,"pA":{"v":44.04,"bar":60},"band":"7% or more"},{"id":"tier-rare","tier":{"v":"rare","cls":"t2","sort":2},"nW":12,"pW":{"v":33.06,"bar":60},"nA":10,"pA":{"v":31.26,"bar":60},"band":"4.5% to 7%"},{"id":"tier-mythic","tier":{"v":"mythic","cls":"t3","sort":3},"nW":10,"pW":{"v":16.31,"bar":60},"nA":8,"pA":{"v":15.77,"bar":60},"band":"2.5% to 4.5%"},{"id":"tier-legendary","tier":{"v":"legendary","cls":"t4","sort":4},"nW":6,"pW":{"v":4.32,"bar":60},"nA":8,"pA":{"v":7.66,"bar":60},"band":"1% to 2.5%"},{"id":"tier-transcendent","tier":{"v":"transcendent","cls":"t5","sort":5},"nW":5,"pW":{"v":1.09,"bar":60},"nA":4,"pA":{"v":1.27,"bar":60},"band":"under 1%"}]},{"t":"cards","cards":[{"t":"card","title":"Where gear comes from","rows":[["Chest room","One weapon, weighted by drop chance (45% of loot rooms are chests, roughly)"],["Merchant","5 different items, weapons and armour weighted together; 75% of shops swap one slot for a utility item and 30% also a charm; price = base x 0.8 to 1.2, rounded to 5"],["Mystery room","one of six kinds, equal odds (see Rooms)"],["Vault relic","one mythic or better weapon or armour, weighted by drop chance"],["Mystery enemy","drops 1 to 2 items by enemy type, 40% a utility item and 15% a charm"],["Dead goblin","drops everything it carried"],["Goblin brain","5% of its knowledge when eaten"]]},{"t":"card","title":"Price formulas","rows":[["Weapon price","round((attack x 3 + 20) / 5) x 5"],["Armour price","round((health x 1.4 + 10) / 5) x 5"],["Reforged price","base x 1.3, rounded to 5"],["Merchant stock price","base price x (0.8 to 1.2), rounded to 5, +10% per round after round 2"]]},{"t":"card","title":"Pool sizes","rows":[["Weapons in the pool",43],["Armour in the pool",39],["Relic candidates",41],["Utility items in shops",20],["Charms in shops",6]]}]}],"rarity":[{"t":"p","text":"Every loot roll picks a rung of the rarity ladder first (a percentage per source, below), then an item inside that rung weighted by its drop weight. The rungs are the game's six tiers: common, uncommon, rare, mythic (the purple \"epic\" tier), legendary and transcendent (the one-of-a-kind tier). A rung with nothing to drop for that kind is skipped and the rest renormalised. Rolls are true random: there is no pity timer and no streak protection."},{"t":"table","id":"rarity-ladder","title":"Drop ladder per source (% of rolls, before empty rungs are skipped)","note":"Treasure is the vault relic pedestal. Tree rooms set their own tier and weight every item inside it.","cols":[{"k":"source","label":"Source","num":0,"cls":""},{"k":"common","label":"Common","num":1,"cls":""},{"k":"uncommon","label":"Uncommon","num":1,"cls":""},{"k":"rare","label":"Rare","num":1,"cls":""},{"k":"mythic","label":"Mythic","num":1,"cls":""},{"k":"legendary","label":"Legendary","num":1,"cls":""},{"k":"transcendent","label":"Transcendent","num":1,"cls":""},{"k":"note","label":"Notes","num":0,"cls":""}],"rows":[{"id":"src-chest","source":"Chest rooms","common":60,"uncommon":25,"rare":10,"mythic":4,"legendary":0.9,"transcendent":0.1,"note":"Weapons only; rolled once per match when the match forms."},{"id":"src-mystery","source":"Mystery rooms (weapon or armour)","common":56,"uncommon":27,"rare":11,"mythic":4.9,"legendary":1,"transcendent":0.1,"note":"A gamble room: a little better than a chest."},{"id":"src-hall","source":"Hall containers (searches)","common":62,"uncommon":25,"rare":9.5,"mythic":3,"legendary":0.45,"transcendent":0.05,"note":"Racks and lockers; the profile can demand a minimum tier, then the rungs below it are dropped and the rest renormalised."},{"id":"src-kill","source":"Enemy drops (mystery enemies, wardens, wisps)","common":66,"uncommon":24,"rare":7.5,"mythic":2.2,"legendary":0.28,"transcendent":0.02,"note":"Each enemy kind sets a minimum tier for its gear; the rungs below it are dropped and the rest renormalised."},{"id":"src-heist","source":"Heist and vault rewards","common":35,"uncommon":30,"rare":20,"mythic":11,"legendary":3.5,"transcendent":0.5,"note":"Vaultbreaker and activity-room rewards: the best odds outside the treasure."},{"id":"src-merchant","source":"Merchant stock","common":62,"uncommon":26,"rare":8.5,"mythic":3,"legendary":0.45,"transcendent":0.05,"note":"Five items per shop, rolled once per match; the price scales with the tier."},{"id":"src-treasure","source":"Treasure (the vault relic pedestal)","common":0,"uncommon":0,"rare":0,"mythic":78,"legendary":20,"transcendent":2,"note":"Always mythic or better."},{"id":"src-tree","source":"Tree rooms (Elder reward, graft prize)","common":"","uncommon":"","rare":"","mythic":"","legendary":"","transcendent":"","note":"Reward tier is set by the tree (mythic or better); within it every item is weighted by its drop weight."}]},{"t":"table","id":"rarity-eff","title":"What the ladder becomes per kind (chest odds)","note":"","cols":[{"k":"kind","label":"Kind","num":0,"cls":""},{"k":"common","label":"Common","num":1,"cls":""},{"k":"uncommon","label":"Uncommon","num":1,"cls":""},{"k":"rare","label":"Rare","num":1,"cls":""},{"k":"mythic","label":"Mythic","num":1,"cls":""},{"k":"legendary","label":"Legendary","num":1,"cls":""},{"k":"transcendent","label":"Transcendent","num":1,"cls":""},{"k":"note","labe
