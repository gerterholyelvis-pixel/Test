<style>
/* layout: header with global search, a sticky tab bar, then blocks (cards, text, sortable tables) of one section at a time; numbers in mono, names in condensed */
:root{--bg:#f3f4ee;--panel:#e8eae0;--line:#cfd3c2;--fg:#1d2418;--mute:#59634d;--accent:#7a5a12;--accent-bg:#e9dcb0;--bar:#b88a1c;

:root[data-theme="dark"]{--bg:#12160f;--panel:#1b2117;--line:#2d3626;--fg:#e6e9dc;--mute:#9aa58d;--accent:#e2b84a;--accent-bg:#3a3014;--bar:#c99a2c;

*{box-sizing:border-box}
html{scroll-padding-top:120px}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 var(--body);padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));padding-block:20px 56px}
main{max-width:1240px;margin:0 auto}
header{display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px;margin-bottom:12px}
h1{font:700 40px/1 var(--disp);letter-spacing:.02em;text-transform:uppercase;margin:0;text-wrap:balance}
.stamp{color:var(--mute);font:12px var(--mono)}
.hdr-r{margin-left:auto;display:flex;gap:8px;align-items:center;flex:1 1 280px;justify-content:flex-end}
#gq{flex:1 1 220px;max-width:440px}
button,input{font:inherit;color:inherit}
input[type=search]{font:15px var(--body);background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:4px;padding:7px 10px;min-width:min(200px,100%)}
.btn{font:500 14px var(--disp);letter-spacing:.06em;text-transform:uppercase;background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:4px;padding:6px 10px;cursor:pointer}
nav{display:flex;flex-wrap:wrap;gap:2px 4px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:6px 0;border-bottom:1px solid var(--line);z-index:3}
nav a{font:500 17px var(--disp);letter-spacing:.04em;text-transform:uppercase;color:var(--mute);border-bottom:3px solid transparent;padding:5px 10px;text-decoration:none}
nav a b{font:400 11px var(--mono);margin-left:5px}
nav a[aria-selected=true]{color:var(--fg);border-bottom-color:var(--accent)}
a{color:var(--link)}
a:focus-visible,button:focus-visible,input:focus-visible,th:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.note{color:var(--mute);font-size:13px}
.lead{max-width:80ch;margin:14px 0 4px}
.blk{margin-top:22px}
.blk h2{font:700 22px var(--disp);letter-spacing:.05em;text-transform:uppercase;margin:0 0 6px}
.bar-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:0 0 8px}
.wrap{overflow-x:auto;border:1px solid var(--line);border-radius:4px;background:var(--bg)}
table{border-collapse:collapse;width:100%;min-width:560px}
th,td{padding:6px 10px;text-align:left;white-space:nowrap;border-bottom:1px solid var(--line);vertical-align:top}
td.wrapc{white-space:normal;min-width:260px;color:var(--mute)}
td.wrapc.long{min-width:340px}
th{font:500 14px var(--disp);letter-spacing:.06em;text-transform:uppercase;background:var(--panel);cursor:pointer;user-select:none;position:sticky;top:0}
th[aria-sort=ascending]::after{content:' \25B2';font-size:10px}th[aria-sort=descending]::after{content:' \25BC';font-size:10px}
td.n,th.n{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
td.name{font:500 17px var(--disp);letter-spacing:.02em}
tr:last-child td{border-bottom:0}
tr.hit td{background:var(--accent-bg);transition:background 2s}
.tier{font:500 12px var(--mono);text-transform:uppercase;letter-spacing:.04em}
.t0{color:var(--t0)}.t1{color:var(--t1)}.t2{color:var(--t2)}.t3{color:var(--t3)}.t4{color:var(--t4)}.t5{color:var(--t5)}
.bars{display:inline-block;height:8px;background:var(--bar);border-radius:1px;vertical-align:middle;margin-right:6px;min-width:1px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:16px;margin-top:18px}
.card{border:1px solid var(--line);border-radius:4px;padding:12px 14px;background:var(--panel);min-width:0}
.card h2{font:700 20px var(--disp);letter-spacing:.05em;text-transform:uppercase;margin:0 0 6px}
.kv{display:flex;justify-content:space-between;gap:14px;padding:3px 0;border-bottom:1px dotted var(--line)}
.kv span:first-child{color:var(--fg)}
.kv span:last-child{text-align:right;color:var(--mute);min-width:0;overflow-wrap:anywhere}
.kv:last-child{border-bottom:0}
#res{margin-top:14px}
#res h3{font:700 18px var(--disp);letter-spacing:.05em;text-transform:uppercase;margin:16px 0 4px}
.hitrow{display:block;padding:6px 8px;border-bottom:1px solid var(--line);text-decoration:none;color:var(--fg)}
.hitrow:hover{background:var(--panel)}
.hitrow b{font:500 17px var(--disp)}
.hitrow span{color:var(--mute);font-size:13px;display:block;overflow-wrap:anywhere}
mark{background:var(--accent-bg);color:inherit;border-radius:2px}
@media (max-width:640px){h1{font-size:32px}nav a{padding:5px 7px;font-size:15px}.hdr-r{justify-content:stretch}#gq{max-width:none}}
@media (prefers-reduced-motion:reduce){tr.hit td{transition:none}}
</style>

ell","weight":{"v":22,"bar":25},"present":{"v":72.3,"bar":70},"what":"Crank the windlass (3 timing hits) to fill a bucket from a pool of 4 that refills 1 per 12 s. Drink it for +3 knowledge (4 drinks a round) or carry it to the sapling: 4 pours ripen a fruit worth +12 knowledge to whoever picks it (1.5 s). A hit spills a carried bucket.","yield":"4 drinks per round at 3 knowledge; the pool refills 1 per 12 s; fruit +12 shared","knowMin":15,"makes":[],"anchors":"well NE, trunk C","npc":"","nums":"wellPool 4; wellRefill 12000 (12 s); wellHits 3; wellDrinks 4; drinkKnow 3; fruitKnow 12; fruitMs 1500 (1.5 s); pourMs 1000 (1 s); stages 4; crankIdle 6000 (6 s); tapCd 400; readyHold 15000 (15 s)"},{"id":"press","name":"Brain Press","weight":{"v":16,"bar":25},"present":{"v":59.4,"bar":70},"what":"Three vats release a Husk every 25 s (at most 3 alive, the first 10 s after someone enters). Kill one for a Husk Brain and crank it in the press (3 s) for +4 knowledge, 6 presses a round. Pour 6 elixir into a vat to rouse a husk early (10 s cooldown).","yield":"about 2.5 husks a minute, 4 knowledge per pressed husk brain; goblin brains exempt","knowMin":10,"makes":[{"v":"Husk Brain","href":"#items/x:huskbrain"}],"anchors":"vats NE,NW,SW, press C","npc":"Husk (hp 30, dmg 6)","nums":"huskEvery 25000 (25 s); huskMax 3; huskFirst 10000 (10 s); pressMs 3000 (3 s); pressCap 6; huskKnow 4; rouseElixir 6; rouseCd 10000 (10 s)"},{"id":"spring","name":"Healing Spring","weight":{"v":14,"bar":25},"present":{"v":55.1,"bar":70},"what":"Stand alone and unhurt in the pool for 1.5 s to heal 2 HP/s (two goblins in it: nobody heals). Bottle Spring Water (heals 20) at a basin in 2 s, 3 bottles a round and 2 carried; add 6 elixir for Blessed Water (heals 40). Basins refill in 25 s. Dry in sudden death.","yield":"heal 2 HP/s for a lone, unhurt goblin; 3 bottles per goblin per round","knowMin":0,"makes":[{"v":"Spring Water","href":"#items/x:springwater"},{"v":"Blessed Water","href":"#items/x:blessedwater"}],"anchors":"pool ring, basins NE,SE,SW","npc":"","nums":"springRefill 25000 (25 s); bottleMs 2000 (2 s); bottleCap 3; bottleCarry 2; blessElixir 6; healPerSec 2; springUnhurt 1500"},{"id":"seer","name":"Seer's Tree","weight":{"v":12,"bar":25},"present":{"v":48.4,"bar":70},"what":"Three seeing stones each carry a ring of 6 glyphs. Turn them (500 ms a step) until all match the eye to fire a Vision for everyone who turned one: an 8 s pulse of every goblin and every room's pick, then the next vaultbreaker layout, then HP. 3 solves a round; the first two pay +3 knowledge.","yield":"3 solves per goblin per round; 2 pay +3 knowledge; the rest is intel","knowMin":6,"makes":[],"anchors":"stones NE,NW,SE, eye C","npc":"","nums":"seerK 6; seerCd 500; seerCap 3; seerKnow 3"},{"id":"graft","name":"Grafting Bench","weight":{"v":10,"bar":25},"present":{"v":43,"bar":70},"what":"Cut a Scion from a branch (2 s; branches regrow in 30 s; 2 carried). Clamp a weapon or armour and a scion in the vise: after 6 s it becomes its reforged + twin (+20%) for free. The owner has 4 s to collect it before anyone can take it. 2 grafts a goblin a round.","yield":"up to 2 grafts per goblin per round; a reforged twin of a weapon or armour","knowMin":0,"makes":[{"v":"Scion","href":"#items/x:scion"}],"anchors":"branches C, bench NE","npc":"","nums":"branchRefill 30000 (30 s); cutMs 2000 (2 s); viseMs 6000 (6 s); viseOwner 4000; graftCap 2; scionCarry 2"},{"id":"thorn","name":"Thorn Shrine","weight":{"v":8,"bar":25},"present":{"v":36.3,"bar":70},"what":"Hold the thorns to bleed 4 HP/s (never lethal) and bank a blessing by hold time: 3 s / 6 s / 9 s for tier I / II / III (Fury +attack, Bark +max HP, Thorns reflect: see the blessing table). 2 grips a round. The blood bowl gathers a drop for each kill in the room (up to 3); drinking it pays +5 knowledge a drop.","yield":"5 knowledge per drop in the bowl (max 3), blessings for HP","knowMin":15,"makes":[],"anchors":"thorns C, bowl SE","npc":"","nums":"grip e","label":"Token use","num":0,"cls":"wrapc"}],"rows":[{"id":"ram","name":"Battering Ram","role":"Siege: loud, co-op, physical","what":"Two crank handles wind the winch with timing presses (up to 6 notches, so a pair winds twice as fast). Release at the lever: the strike adds 3 breach per notch to the vault door. 50 is Cracked, 100 is Broken; breach decays by 20 each round boundary. Anyone in the lane takes 25. Defenders can slack the winch (1.5 s) or raise a barricade (60 HP; 2 metal or 10 elixir). In sudden death it becomes Quake: a full strike knocks everyone off the dais, freezing claims 3 s (15 s cooldown).","vote":"A door at breach 50+ gives any room picking it +1 vote; at 100 the door opens at the round end whatever the votes","token":{"v":"Iron Wedge","href":"#items/x:ironwedge"},"tokenUse":"Locksmith grindstone: a free Key Blank","nums":"NOTCH_MAX 6; WINCH_PER 700 / 900; WINCH_WIN 0.3; SWING_MS 1200 (1.2 s); PER_NOTCH 3; STRIKE_POWER 8; LANE_DMG 25; SLACK_MS 1500 (1.5 s); HANDLE_IDLE 6000 (6 s); BAR_HP 60; BAR_MS 1500 (1.5 s); BAR_CD 20000 (20 s); BAR_METAL 2; BAR_ELIXIR 10; CHOP 10; CHOP_CD 700; QUAKE_CD 15000 (15 s); QUAKE_FREEZE 3000; CRACKED 50; BROKEN 100; BREACH_DECAY 20"},{"id":"locksmith","name":"Locksmith","role":"Stealth: precision, quiet","what":"Grind a Key Blank (3 s), set 5 pins in order with timing presses, then cut (3 s) a Vault Lockpick, a Skeleton Key or fence the cut for gold and knowledge. Misses add 18 noise, jiggling 25; noise decays 3/s. At 50 the room shows on every minimap (until 40); at 100 the lock alarm releases Vault Wardens (up to 4). In sudden death the cut makes a Crown Seal.","vote":"Vault Lockpick: +1 vote in a room whose pick is a vault door","token":{"v":"Skeleton Key","href":"#items/x:skeleton"},"tokenUse":"Counting House strongbox: a fast silent robbery","nums":"PINS 5; PIN_PER 900 / 1200 (1.2 s); PIN_WIN 0.18; NOISE_MISS 18; NOISE_JIGGLE 25; NOISE_DECAY 3; GRIND_MS 3000 (3 s); CUT_MS 3000 (3 s); JIGGLE_CD 1500 (1.5 s); LOUD_ON 50; LOUD_OFF 40; ALARM 100; WARDEN_MAX 4"},{"id":"counting","name":"Counting House","role":"Economy: vote market and a robbery","what":"Buy Writs at the desk, each +1 weight on this room's pick: 20 / 30 / 40 gold, rising. A Counter-writ costs 1.5x and cancels one. The strongbox collects payments, 50% of every panel bribe in the arena and 3 gold per 5 s (cap 300). Rob it in 6 s (loud, 15 s on every minimap) or 1.5 s silently with a Skeleton Key: coin sacks of 40 gold, up to 4, carried slowly. A box of 40+ also yields Gold Leaf. In sudden death the desk sells bounties on the top claimant (30, +15 each).","vote":"Each net writ (writs minus counter-writs) is +1 vote for its room","token":{"v":"Gold Leaf","href":"#items/x:goldleaf"},"tokenUse":"Keystone altar: lights the next 2 stones","nums":"WRIT 20 / 30 / 40; SACK 40; SACKS_MAX 4; ROB_MS 6000 (6 s); ROB_KEY_MS 1500 (1.5 s); LOUD_MS 15000 (15 s); INTEREST 3; INTEREST_MS 5000 (5 s); BOX_CAP 300; BRIBE_SHARE 0.5; BOUNTY 30; BOUNTY_STEP 15; GOLDLEAF_MIN 40"},{"id":"keystone","name":"Keystone","role":"Ritual: an ordered circuit of flames","what":"Light the rune stones in the order the socket shows (2 s each, within 8 s of the last; a wrong stone is a 8 damage backlash and the circuit goes dark). Stones burn 35 s; anyone can feed one (1 s) or snuff one (1.5 s). Armed at the tally = extra vote. Resonance at 30 / 60 / 90 raises wisps (max 3) that snuff stones. Gold Leaf at the altar lights the next two. Sudden death: Ward slows the top claimant's gains to 50%.","vote":"Armed at the tally: +1 vote (so one pick counts 2)","token":{"v":"Rune Charge","href":"#items/x:runecharge"},"tokenUse":"Ram lever: the next strike does double breach","nums":"STONE_BURN 35000 (35 s); STONE_CHAIN 8000 (8 s); LIGHT_MS 2000 (2 s); FEED_MS 1000 (1 s); SNUFF_MS 1500 (1.5 s); OFFER_MS 1000 (1 s); BACKLASH 8; WISP_SNUFF_MS 2000 (2 s); RES_THR 30 / 60 / 90; WISP_MAX 3"}]},{"t":"table","id":"vbnums","title":"Vaultbreaker tuning numbers","note"   let rows = b.rows.filter(r => !needle || b.cols.some(c => ctext(r[c.k]).toLowerCase().includes(needle)));
  if (sk) rows = [...rows].sort((a, z) => { const x = csort(a[sk.k]), y = csort(z[sk.k]); if (x == null) return y == null ? 0 : 1; if (y == null) return -1; const n = typeof x === 'number' && typeof y === 'number'; return (n ? x - y : String(x).localeCompare(String(y), undefined, { numeric: true })) * sk.d; });
  const head = b.cols.map(c => `<th tabindex="0" class="${c.num ? 'n' : ''}" data-t="${esc(b.id)}" data-k="${esc(c.k)}"${sk && sk.k === c.k ? ` aria-sort="${sk.d > 0 ? 'ascending' : 'descending'}"` : ''}>${esc(c.label)}</th>`).join('');
  const body = rows.map(r => '<tr data-id="' + esc(r.id) + '">' + b.cols.map(c => `<td class="${c.num ? 'n ' : ''}${c.cls || ''}${c.cls === 'wrapc' && String(ctext(r[c.k])).length > 120 ? ' long' : ''}">${cell(r[c.k], c)}</td>`).join('') + '</tr>').join('');
  const filt = b.rows.length > 10 ? `<input type="search" class="tf" data-t="${esc(b.id)}" aria-label="Filter ${esc(b.title || b.id)}" placeholder="Filter ${rows.length} of ${b.rows.length}" value="${esc(state.filter[b.id] || '')}">` : '';
  return `<section class="blk" id="b-${esc(b.id)}"><h2>${esc(b.title || '')}</h2><div class="bar-row">${filt}<span class="note">${esc(b.note || '')}</span></div><div class="wrap"><table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div></section>`;
}
const card = c => `<div class="card"><h2>${esc(c.title)}</h2>${c.rows.map(([k, v]) => `<div class="kv"><span>${cell(k)}</span><span>${cell(v)}</span></div>`).join('')}${c.note ? `<p class="note">${esc(c.note)}</p>` : ''}</div>`;
function block(b) {
  if (b.t === 'p') return `<p class="lead">${esc(b.text)}</p>`;
  if (b.t === 'table') return table(b);
  if (b.t === 'cards') return `<div class="grid">${b.cards.map(card).join('')}</div>`;
  if (b.t === 'card') return `<div class="grid">${card(b)}</div>`;
  return '';
}
function tabs() { $('tabs').innerHTML = D.tabs.map(t => `<a href="#${t.id}" role="tab" aria-selected="${t.id === state.tab && !state.q}">${esc(t.label)}${t.n != null ? `<b>${t.n}</b>` : ''}</a>`).join(''); }
function view(keep) {
  tabs();
  $('res').hidden = !state.q; $('view').hidden = !!state.q;
  if (state.q) return results();
  $('view').innerHTML = (D.sections[state.tab] || []).map(block).join('');
  if (keep) { const i = document.querySelector(`.tf[data-t="${keep.t}"]`); if (i) { i.focus(); i.setSelectionRange(keep.p, keep.p); } }
}
function results() {
  const words = state.q.toLowerCase().split(/\s+/).filter(Boolean), hits = INDEX.filter(e => { const h = (e.title + ' ' + e.text + ' ' + e.kind).toLowerCase(); return words.every(w => h.includes(w)); });
  const by = {}; for (const h of hits) (by[h.tab] = by[h.tab] || []).push(h);
  const mk = s => { let t = esc(s); for (const w of words) { const re = new RegExp('(' + w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'ig'); t = t.replace(re, '<mark>$1</mark>'); } return t; };
  const snip = (e) => { const t = e.text; const i = Math.max(0, t.toLowerCase().indexOf(words[0] || '')); return t.slice(Math.max(0, i - 30), i + 110); };
  $('res').innerHTML = `<p class="note">${hits.length} result${hits.length === 1 ? '' : 's'} for "${esc(state.q)}"${hits.length > 150 ? ' (showing the first 150)' : ''}</p>` + Object.keys(by).map(t => `<h3>${esc(TAB(t).label)} (${by[t].length})</h3>` + by[t].slice(0, 150).map(e => `<a class="hitrow" href="#${t}${e.ref ? '/' + encodeURIComponent(e.ref) : ''}"><b>${mk(e.title)}</b> <span>${esc(e.kind)}: ${mk(snip(e))}</span></a>`).join('')).join('');
}
function route() {
  const h = decodeURIComponent((location.hash || '#overview').slice(1)), i = h.indexOf('/'), tab = i < 0 ? h : h.slice(0, i);
  state.tab = TAB(tab) ? tab : 'overview'; state.ref = i < 0 ? '' : h.slice(i + 1);
  if (state.ref) { state.q = ''; $('gq').value = ''; }
  view();
  if (state.ref) {
    const tr = [...document.querySelectorAll('tr[data-id]')].find(r => r.dataset.id === state.ref);
    if (tr) { const f = tr.closest('table'), b = tr.closest('section'); tr.classList.add('hit'); tr.scrollIntoView({ block: 'center' }); setTimeout(() => tr.classList.remove('hit'), 2600); }
  } else if (!state.q) window.scrollTo(0, 0);
  document.title = 'Goblin King Codex: ' + TAB(state.tab).label;
}
document.addEventListener('click', e => {
  const th = e.target.closest('th[data-k]');
  if (th) { const t = th.dataset.t, k = th.dataset.k, cur = state.sort[t]; state.sort[t] = { k, d: cur && cur.k === k ? -cur.d : 1 }; view(); }
});
document.addEventListener('keydown', e => { const th = e.target.closest && e.target.closest('th[data-k]'); if (th && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); th.click(); } });
document.addEventListener('input', e => {
  if (e.target.id === 'gq') { state.q = e.target.value.trim(); view(); if (!state.q) route(); }
  else if (e.target.classList.contains('tf')) { const t = e.target.dataset.t; state.filter[t] = e.target.value; view({ t, p: e.target.selectionStart }); }
});
$('theme').addEventListener('click', () => {
  const cur = document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'), nx = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = nx; try { localStorage.setItem('gk.codex.theme', nx); } catch (er) {}
});
try { const th = localStorage.getItem('gk.codex.theme'); if (th) document.documentElement.dataset.theme = th; } catch (er) {}
addEventListener('hashchange', () => { state.q = ''; $('gq').value = ''; route(); });
$('stamp').textContent = 'generated ' + D.stamp;
route();
</script>
