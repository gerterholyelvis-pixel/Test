<title>Goblin King Codex</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700&family=Barlow:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* layout: sticky tab bar over one wide, sortable table at a time; numbers in mono, names in condensed */
:root{--bg:#f3f4ee;--panel:#e8eae0;--line:#cfd3c2;--fg:#1d2418;--mute:#59634d;--accent:#7a5a12;--accent-bg:#e9dcb0;
--t0:#6b7466;--t1:#2f7a3c;--t2:#2b63b8;--t3:#8a3fb5;--t4:#b8651a;--t5:#a8261f;--up:#2f7a3c;--down:#a8261f;
--disp:'Barlow Condensed','Arial Narrow',sans-serif;--body:'Barlow',system-ui,sans-serif;--mono:'JetBrains Mono',ui-monospace,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12160f;--panel:#1b2117;--line:#2d3626;--fg:#e6e9dc;--mute:#9aa58d;--accent:#e2b84a;--accent-bg:#3a3014;
--t0:#9aa58d;--t1:#6fcf7e;--t2:#7aa8ee;--t3:#c28be8;--t4:#f0a050;--t5:#ff7a70;--up:#6fcf7e;--down:#ff7a70;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12160f;--panel:#1b2117;--line:#2d3626;--fg:#e6e9dc;--mute:#9aa58d;--accent:#e2b84a;--accent-bg:#3a3014;
--t0:#9aa58d;--t1:#6fcf7e;--t2:#7aa8ee;--t3:#c28be8;--t4:#f0a050;--t5:#ff7a70;--up:#6fcf7e;--down:#ff7a70;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:15px/1.45 var(--body);padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
main{max-width:1180px;margin:0 auto}
header{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 18px;margin-bottom:14px}
h1{font:700 40px/1 var(--disp);letter-spacing:.02em;text-transform:uppercase;margin:0;text-wrap:balance}
.stamp{color:var(--mute);font:12px var(--mono)}
nav{display:flex;flex-wrap:wrap;gap:4px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:8px 0;border-bottom:1px solid var(--line);z-index:2}
nav button{font:500 17px var(--disp);letter-spacing:.04em;text-transform:uppercase;background:none;color:var(--mute);border:0;border-bottom:3px solid transparent;padding:6px 12px;cursor:pointer}
nav button b{font:400 12px var(--mono);margin-left:6px;color:var(--mute)}
nav button[aria-selected=true]{color:var(--fg);border-bottom-color:var(--accent)}
nav button:focus-visible,input:focus-visible,th:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.bar{display:flex;gap:10px;margin:14px 0 10px;align-items:center;flex-wrap:wrap}
input[type=search]{font:15px var(--body);background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:4px;padding:7px 10px;min-width:min(260px,100%)}
.note{color:var(--mute);font-size:13px}
.wrap{overflow-x:auto;border:1px solid var(--line);border-radius:4px}
table{border-collapse:collapse;width:100%;min-width:640px}
th,td{padding:7px 10px;text-align:left;white-space:nowrap;border-bottom:1px solid var(--line)}
td.wrapc{white-space:normal;min-width:240px;color:var(--mute)}
th{font:500 14px var(--disp);letter-spacing:.06em;text-transform:uppercase;background:var(--panel);cursor:pointer;user-select:none;position:sticky;top:0}
th[aria-sort=ascending]::after{content:' \25B2';font-size:10px}th[aria-sort=descending]::after{content:' \25BC';font-size:10px}
td.n,th.n{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
td.name{font:500 17px var(--disp);letter-spacing:.02em}
tr:last-child td{border-bottom:0}
.tier{font:500 12px var(--mono);text-transform:uppercase;letter-spacing:.04em}
.t0{color:var(--t0)}.t1{color:var(--t1)}.t2{color:var(--t2)}.t3{color:var(--t3)}.t4{color:var(--t4)}.t5{color:var(--t5)}
.up{color:var(--up)}.down{color:var(--down)}
.bars{display:inline-block;height:8px;background:var(--accent);border-radius:1px;vertical-align:middle;margin-right:6px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:18px;margin-top:14px}
.card{border:1px solid var(--line);border-radius:4px;padding:14px 16px;background:var(--panel);min-width:0}
.card h2{font:700 20px var(--disp);letter-spacing:.05em;text-transform:uppercase;margin:0 0 8px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:3px 0;border-bottom:1px dotted var(--line)}
.kv span:last-child{font-family:var(--mono);text-align:right}
@media (max-width:520px){h1{font-size:32px}nav button{padding:6px 8px;font-size:15px}}
</style>
<main>
<header><h1>Goblin King Codex</h1><span class="stamp" id="stamp"></span></header>
<nav id="tabs" role="tablist"></nav>
<div id="view"></div>
</main>
<script>
const D = /*DATA*/null;
const TABS = [['overview', 'Overview'], ['goblins', 'Goblins', D.goblins.length], ['weapons', 'Weapons', D.weapons.length], ['armour', 'Armour', D.armour.length], ['items', 'Items', D.others.length], ['recipes', 'Recipes', D.recipes.length]];
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const tierCell = r => `<span class="tier t${r.tierN}">${esc(r.tier)}</span>`;
const sign = v => v ? `<span class="${v > 0 ? 'up' : 'down'}">${v > 0 ? '+' : ''}${v}%</span>` : '';
// column spec: [key, label, numeric?, render?, sortValue?]
const SPEC = {
  goblins: { rows: D.goblins, cols: [['n', '#', 1], ['name', 'Goblin', 0, r => esc(r.name), 0, 'name'], ['odds', 'Odds %', 1, r => `<span class="bars" style="width:${Math.max(2, r.odds * 3)}px"></span>${r.odds}`], ['speed', 'Speed x', 1], ['size', 'Size x', 1], ['hp', 'Start HP', 1], ['knowledge', 'Start know.', 1], ['weapon', 'Weapon'], ['armor', 'Armour'], ['perk', 'Perk', 0, r => esc(r.perk), 0, 'wrapc']], note: 'Odds are the chance of being assigned each goblin when you join a match. Start HP comes from the starting armour.' },
  weapons: { rows: D.weapons, cols: [['name', 'Weapon', 0, r => esc(r.name), 0, 'name'], ['tierN', 'Tier', 0, tierCell], ['family', 'Family'], ['dmg', 'Damage', 1], ['reach', 'Reach m', 1], ['swing', 'Swing ms', 1], ['dps', 'DPS', 1], ['ranged', 'Ranged'], ['drop', 'Drop %', 1], ['price', 'Price', 1], ['scrap', 'Recycles to']], note: 'Drop % is the share of weapon drops. DPS is damage per second of swings.' },
  armour: { rows: D.armour, cols: [['name', 'Armour', 0, r => esc(r.name), 0, 'name'], ['tierN', 'Tier', 0, tierCell], ['family', 'Family'], ['hp', 'Health', 1], ['speed', 'Speed', 1, r => sign(r.speed)], ['drop', 'Drop %', 1], ['price', 'Price', 1], ['scrap', 'Recycles to']], note: 'Health is the armour value added to your health pool. Speed is the movement change while worn.' },
  items: { rows: D.others, cols: [['name', 'Item', 0, r => esc(r.name), 0, 'name'], ['type', 'Type'], ['tierN', 'Tier', 0, tierCell], ['family', 'Family'], ['price', 'Price', 1], ['effect', 'What it does', 0, r => esc(r.effect), 0, 'wrapc']], note: 'Consumables, throwables and other non-gear.' },
  recipes: { rows: D.recipes, cols: [['out', 'Makes', 0, r => esc(r.out), 0, 'name'], ['kind', 'Kind'], ['tier', 'Tier', 1], ['needs', 'Knowledge', 1], ['cost', 'Parts']], note: 'Crafted at the workbench. Knowledge is the amount you must have to craft it.' }
};
let tab = (location.hash || '#overview').slice(1), q = '', sortKey = null, sortDir = 1;
try { q = sessionStorage.getItem('q') || ''; } catch (e) {}
function tabs() {
  document.getElementById('tabs').innerHTML = TABS.map(([k, l, n]) => `<button role="tab" data-k="${k}" aria-selected="${k === tab}">${l}${n != null ? `<b>${n}</b>` : ''}</button>`).join('');
}
function overview() {
  const c = D.combat, tops = (rows, key, n = 3) => [...rows].sort((a, b) => b[key] - a[key]).slice(0, n);
  const best = tops(D.weapons, 'dps').map(w => `<div class="kv"><span>${esc(w.name)}</span><span>${w.dps} dps</span></div>`).join('');
  const tough = tops(D.armour, 'hp').map(a => `<div class="kv"><span>${esc(a.name)}</span><span>${a.hp} hp</span></div>`).join('');
  return `<div class="grid">
  <div class="card"><h2>Game numbers</h2>${Object.entries(c).map(([k, v]) => `<div class="kv"><span>${k}</span><span>${v}</span></div>`).join('')}
    <div class="kv"><span>Starting gold</span><span>${D.startGold}</span></div><div class="kv"><span>Backpack / quick slots</span><span>${D.slots.backpack} / ${D.slots.quick}</span></div></div>
  <div class="card"><h2>Roster</h2>${Object.entries(D.counts).map(([k, v]) => `<div class="kv"><span>${k}</span><span>${v}</span></div>`).join('')}</div>
  <div class="card"><h2>Tiers</h2>${D.tiers.map(t => `<div class="kv"><span class="tier t${t.n}">${t.tier}</span><span>${t.n}</span></div>`).join('')}
    <div class="kv"><span>Knowledge thresholds</span><span>${D.knowledgeTiers.join(' / ')}</span></div></div>
  <div class="card"><h2>Highest DPS</h2>${best}</div>
  <div class="card"><h2>Toughest armour</h2>${tough}</div>
  <div class="card"><h2>Goblin odds</h2>${D.goblins.map(g => `<div class="kv"><span>${esc(g.name)}</span><span>${g.odds}%</span></div>`).join('')}</div></div>`;
}
function table() {
  const S = SPEC[tab]; const needle = q.trim().toLowerCase();
  let rows = S.rows.filter(r => !needle || JSON.stringify(r).toLowerCase().includes(needle));
  if (sortKey) rows = [...rows].sort((a, b) => (a[sortKey] > b[sortKey] ? 1 : a[sortKey] < b[sortKey] ? -1 : 0) * sortDir);
  const head = S.cols.map(c => `<th tabindex="0" class="${c[2] ? 'n' : ''}" data-k="${c[0]}"${sortKey === c[0] ? ` aria-sort="${sortDir > 0 ? 'ascending' : 'descending'}"` : ''}>${c[1]}</th>`).join('');
  const body = rows.map(r => '<tr>' + S.cols.map(c => `<td class="${c[2] ? 'n ' : ''}${c[5] || ''}">${c[3] ? c[3](r) : esc(r[c[0]] == null ? '' : r[c[0]])}</td>`).join('') + '</tr>').join('');
  return `<div class="bar"><input type="search" id="q" aria-label="Filter rows" placeholder="Filter ${rows.length} of ${S.rows.length}" value="${esc(q)}"><span class="note">${esc(S.note)}</span></div>
  <div class="wrap"><table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>`;
}
function render(keepFocus) {
  tabs(); document.getElementById('view').innerHTML = tab === 'overview' || !SPEC[tab] ? overview() : table();
  if (keepFocus) { const i = document.getElementById('q'); if (i) { i.focus(); i.setSelectionRange(q.length, q.length); } }
}
document.getElementById('stamp').textContent = 'generated ' + D.stamp;
document.addEventListener('click', e => {
  const b = e.target.closest('nav button'); if (b) { tab = b.dataset.k; sortKey = null; location.hash = tab; render(); return; }
  const th = e.target.closest('th'); if (th) { const k = th.dataset.k; sortDir = sortKey === k ? -sortDir : 1; sortKey = k; render(); }
});
document.addEventListener('keydown', e => { const th = e.target.closest && e.target.closest('th'); if (th && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); th.click(); } });
document.addEventListener('input', e => { if (e.target.id === 'q') { q = e.target.value; try { sessionStorage.setItem('q', q); } catch (x) {} render(true); } });
addEventListener('hashchange', () => { tab = (location.hash || '#overview').slice(1); render(); });
render();
</script>
