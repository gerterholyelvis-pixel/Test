<!doctype html>
<html><head><meta charset="utf-8"><title>Tree rooms B preview</title>
<style>html,body{margin:0;background:#111;overflow:hidden}canvas{display:block}#hud{position:fixed;left:8px;top:8px;color:#ddd;font:12px monospace;text-shadow:0 0 3px #000;white-space:pre}</style>
<script type="importmap">{"imports":{"three":"/three/three.module.js","three/addons/":"/three/addons/"}}</script></head>
<body><div id="hud"></div>
<script type="module">
// Standalone preview for rooms5art-trees-b.js.  ?type=thorn|gambler|memory|hollow|elder  &cam=wide|front|close|back|top|corner|se|ne|nw|sw|nook|up  &st=0|1 (state off / state max)
// Serve the repo root with /three/ mapped to node_modules/three/build (see docs/reports/trees-b-art.md).
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { buildTreeRoom } from '/rooms5art-trees-b.js';
const q = new URLSearchParams(location.search), type = q.get('type') || 'thorn', camName = q.get('cam') || 'wide', st = +(q.get('st') || 0), H = 6.5, S = 15;
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true }); renderer.setPixelRatio(1); const W = +(q.get("w") || 1280), Hh = +(q.get("h") || 720); renderer.setSize(W, Hh); renderer.domElement.style.cssText = "width:100vw;height:auto;max-height:100vh;object-fit:contain";
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.0; document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x1a1c20); scene.fog = new THREE.Fog(0x1a1c20, 18, 40);
const pm = new THREE.PMREMGenerator(renderer); scene.environment = pm.fromScene(new RoomEnvironment(), 0.04).texture; scene.environmentIntensity = 0.5;
scene.add(new THREE.HemisphereLight(0xdfe6ff, 0x7a6a5a, 0.9));
// room shell like the game's: off-white floor, walls, ceiling with a hole, a few point lights
const shellM = new THREE.MeshStandardMaterial({ color: 0xeeeae2, roughness: 0.85 }), floorM = new THREE.MeshStandardMaterial({ color: 0xd9d4c8, roughness: 0.8 });
const floor = new THREE.Mesh(new THREE.PlaneGeometry(S, S), floorM); floor.rotation.x = -Math.PI / 2; scene.add(floor);
for (const [x, z, ry] of [[0, -S / 2, 0], [0, S / 2, Math.PI], [-S / 2, 0, Math.PI / 2], [S / 2, 0, -Math.PI / 2]]) { const w = new THREE.Mesh(new THREE.PlaneGeometry(S, H), shellM); w.position.set(x, H / 2, z); w.rotation.y = ry; scene.add(w); }
const hole = new THREE.Shape(); hole.moveTo(-S / 2, -S / 2); hole.lineTo(S / 2, -S / 2); hole.lineTo(S / 2, S / 2); hole.lineTo(-S / 2, S / 2); const hp = new THREE.Path(); hp.absarc(0, 0, 1.7, 0, Math.PI * 2, true); hole.holes.push(hp);
const ceil = new THREE.Mesh(new THREE.ShapeGeometry(hole), shellM); ceil.rotation.x = Math.PI / 2; ceil.position.y = H; scene.add(ceil);
for (const [x, z] of [[-4.5, -4.5], [4.5, -4.5], [-4.5, 4.5], [4.5, 4.5]]) { const l = new THREE.PointLight(0xfff0dc, 38, 22, 1.6); l.position.set(x, H - 0.6, z); scene.add(l); }
const room = buildTreeRoom(THREE, {}, type, { height: H, size: S, seed: +(q.get('seed') || 1), lite: q.has('lite') });
scene.add(room); const api = room.userData.api; window.room = room; window.api = api;
if (st) {
  if (type === 'thorn') { api.setGrip(3); api.setBowl(3); } if (type === 'gambler') { api.setStep(3); api.setGourds(5); api.setMouth(1); }
  if (type === 'memory') { api.setAllLanterns(0); api.setLantern(1, 1); api.setLantern(3, 0.6); api.setTrunkGlow(1); } if (type === 'hollow') api.setWarden(1);
  if (type === 'elder') { api.setStone(0, 1); api.setStone(1, 0.6); api.setStone(2, 0.15); api.setWake(0.8); api.setSeed(true); }
}
const camera = new THREE.PerspectiveCamera(70, W / Hh, 0.1, 80);
const P = { wide: [0, 1.7, 7.0, 0, 2.6, 0], front: [0, 1.7, 4.6, 0, 1.8, 0], close: [1.6, 1.7, 3.4, 0, 1.6, 0], back: [0, 3.2, -7.2, 0, 1.6, 0], top: [0.001, 14, 0.01, 0, 0, 0], corner: [-6.6, 1.7, -6.6, 2, 1.5, 2], se: [0.8, 1.7, 1.5, 4.2, 1.0, 4.2], ne: [0.0, 1.7, -1.0, 4.2, 1.1, -4.2], nw: [0, 1.7, -1.0, -4.2, 1.2, -4.2], sw: [0, 1.7, 1.0, -4.2, 1.2, 4.2], nook: [0, 1.7, 5.6, 0, 2.0, 1.0], ne2: [2.6, 1.7, -0.6, 4.2, 1.3, -4.2], sw2: [-2.0, 1.7, 1.8, -4.2, 0.8, 4.2], se2: [2.0, 1.7, 2.0, 4.2, 1.0, 4.2], up: [0, 1.7, 3.2, 0, 4.4, 0] };
const c = P[camName] || P.wide; camera.position.set(c[0], c[1], c[2]); camera.lookAt(c[3], c[4], c[5]);
if (q.has('fov')) { camera.fov = +q.get('fov'); camera.updateProjectionMatrix(); }
const hud = document.getElementById('hud');
let t = 0; function frame() { t += 0.016; if (!q.has('still')) api.update(t, 0.016); renderer.render(scene, camera); window.__frames = (window.__frames || 0) + 1;
  hud.textContent = `${type} cam=${camName} st=${st}  room meshes: ${api.drawCalls()}  gl calls: ${renderer.info.render.calls}  tris: ${renderer.info.render.triangles}  solids: ${api.solids.length}`; requestAnimationFrame(frame);
  if (q.has('save') && window.__frames === 4) fetch('/save?name=' + q.get('save'), { method: 'POST', body: renderer.domElement.toDataURL('image/jpeg', 0.9) }); } frame();   // ?save=name posts a JPEG to a dev server's /save (optional, for headless screenshots)
</script></body></html>
