<!doctype html>
<html><head><meta charset="utf-8"><title>Goblin King</title>
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<style>
html,body{margin:0;height:100%;background:#0b0b0e;overflow:hidden;font-family:system-ui,sans-serif;color:#f2efe6}
canvas{display:block}
#vig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 35%,rgba(0,0,0,.05) 60%,rgba(0,0,0,.16) 85%,rgba(0,0,0,.28) 100%)}
#hud{position:fixed;top:0;left:0;right:0;text-align:center;padding-top:2vh;pointer-events:none;text-shadow:0 2px 8px #000}
#me{font-size:clamp(20px,3vw,34px);font-weight:700;color:#ffd75e}
#cnt{font-size:clamp(13px,1.6vw,17px);color:#cfd3dc}
#dot{position:fixed;left:50%;top:50%;width:5px;height:5px;margin:-2.5px;border-radius:50%;background:#fff;opacity:.7;pointer-events:none}
#hint{position:fixed;bottom:2.5vh;left:0;right:0;text-align:center;font-size:14px;color:#e5e7ee;text-shadow:0 1px 6px #000;pointer-events:none}
#play{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(8,8,12,.55);cursor:pointer}
#play div{padding:22px 34px;border-radius:14px;background:#15151c;border:1px solid #3a3a48;text-align:center;line-height:1.7}
#play b{font-size:26px;color:#ffd75e;letter-spacing:.04em}
#rr{position:fixed;top:2vh;right:2vw;display:none;padding:8px 14px;font:600 14px system-ui;color:#15151c;background:#ffd75e;border:0;border-radius:16px;cursor:pointer}
</style>
<script type="importmap">{"imports":{"three":"/three/three.module.js"}}</script>
</head>
<body>
<div id="vig"></div><div id="dot"></div>
<div id="hud"><div id="me">Connecting...</div><div id="cnt"></div></div>
<div id="hint">WASD move &nbsp;·&nbsp; Mouse look &nbsp;·&nbsp; Shift sprint &nbsp;·&nbsp; V overview</div>
<button id="rr">New goblin</button>
<div id="play"><div><b>GOBLIN KING</b><br>Click to play<br><small>WASD to move, mouse to look, Esc to release the mouse</small></div></div>
<script type="module">
import * as THREE from 'three';
window.THREE = THREE;
await import('/game.js');
await import('/menu.js');
</script>
</body></html>
