<!doctype html>
<html><head><meta charset="utf-8"><title>Goblin King</title>
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<style>
html,body{margin:0;height:100%;background:#12091f;color:#e8d9ff;font-family:system-ui,sans-serif;overflow:hidden}
canvas{display:block;width:100%;height:100%}
</style></head>
<body><canvas id="c"></canvas>
<script>
const NAMES = ['Small Goblin', 'Goblin', 'Big Goblin', 'Goblin Wizard', 'GOBLIN KING'];
const SIZE = [0.7, 0.9, 1.15, 0.95, 1.1];
const SKIN = ['#7bd35a', '#5fbf3f', '#3f9a2c', '#5fbf8f', '#8fd23a'];
const cv = document.getElementById('c'), g = cv.getContext('2d');
let players = [], me = 0, W, H;

function resize() { W = cv.width = innerWidth * devicePixelRatio; H = cv.height = innerHeight * devicePixelRatio; }
addEventListener('resize', resize); resize();

const ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host);
ws.onmessage = e => { const d = JSON.parse(e.data); if (d.you) me = d.you; if (d.players) players = d.players; };

function goblin(x, y, s, t, mine) {
  g.save(); g.translate(x, y); g.scale(s, s);
  if (mine) { g.strokeStyle = '#ffd75e'; g.lineWidth = 4; g.beginPath(); g.ellipse(0, 52, 38, 10, 0, 0, 7); g.stroke(); }
  g.fillStyle = SKIN[t];
  g.beginPath(); g.ellipse(0, 25, 24, 28, 0, 0, 7); g.fill();             // body
  g.beginPath(); g.arc(0, -14, 24, 0, 7); g.fill();                         // head
  g.beginPath(); g.moveTo(-20, -18); g.lineTo(-46, -34); g.lineTo(-22, -4); g.fill(); // ears
  g.beginPath(); g.moveTo(20, -18); g.lineTo(46, -34); g.lineTo(22, -4); g.fill();
  g.fillStyle = '#fff'; g.beginPath(); g.arc(-9, -17, 6, 0, 7); g.arc(9, -17, 6, 0, 7); g.fill();
  g.fillStyle = '#220'; g.beginPath(); g.arc(-8, -16, 3, 0, 7); g.arc(10, -16, 3, 0, 7); g.fill();
  g.strokeStyle = '#220'; g.lineWidth = 2.5; g.beginPath(); g.arc(0, -6, 9, 0.2, 2.9); g.stroke(); // grin
  if (t === 3) { // wizard hat + stars
    g.fillStyle = '#5a2bb8'; g.beginPath(); g.moveTo(-26, -30); g.lineTo(0, -88); g.lineTo(26, -30); g.fill();
    g.fillRect(-32, -34, 64, 8);
    g.fillStyle = '#ffe36e'; g.beginPath(); g.arc(0, -52, 4, 0, 7); g.fill();
  }
  if (t === 4) { // crown
    g.fillStyle = '#ffd13d'; g.beginPath();
    g.moveTo(-24, -32); g.lineTo(-24, -58); g.lineTo(-12, -44); g.lineTo(0, -62); g.lineTo(12, -44); g.lineTo(24, -58); g.lineTo(24, -32); g.fill();
    g.fillStyle = '#e33'; g.beginPath(); g.arc(0, -40, 4, 0, 7); g.fill();
  }
  g.restore();
}

function draw() {
  g.fillStyle = '#12091f'; g.fillRect(0, 0, W, H);
  const side = Math.min(W, H * 0.8) * 0.94, cell = side / 3;
  const ox = (W - side) / 2, oy = (H - side) / 2 + H * 0.04;
  for (let i = 0; i < 9; i++) {
    const x = ox + (i % 3) * cell, y = oy + Math.floor(i / 3) * cell;
    g.fillStyle = i === 4 ? '#2a1646' : '#3a2160'; g.strokeStyle = '#7b4fd0'; g.lineWidth = 3 * devicePixelRatio;
    g.beginPath(); g.roundRect(x + 5, y + 5, cell - 10, cell - 10, 18); g.fill(); g.stroke();
    const here = players.filter(p => p.box === i);
    here.forEach((p, k) => {
      const off = here.length > 1 ? (k - (here.length - 1) / 2) * cell * 0.3 : 0;
      goblin(x + cell / 2 + off, y + cell * 0.45, cell / 150 * SIZE[p.goblin], p.goblin, p.id === me);
    });
  }
  const mine = players.find(p => p.id === me);
  g.fillStyle = '#ffd75e'; g.textAlign = 'center'; g.font = `bold ${H * 0.04}px system-ui`;
  g.fillText(mine ? 'You are: ' + NAMES[mine.goblin] : 'Connecting...', W / 2, H * 0.07);
  g.fillStyle = '#9d86c9'; g.font = `${H * 0.025}px system-ui`;
  g.fillText('Goblin King  -  ' + players.length + ' online', W / 2, H * 0.11);
  requestAnimationFrame(draw);
}
draw();
</script></body></html>
