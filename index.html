<!doctype html>
<html><head><meta charset="utf-8"><title>Goblin King</title>
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<style>
html,body{margin:0;height:100%;background:#12091f;overflow:hidden;font-family:system-ui,sans-serif;color:#e8d9ff}
canvas{display:block}
#hud{position:fixed;top:0;left:0;right:0;text-align:center;padding-top:2vh;pointer-events:none;text-shadow:0 2px 8px #000}
#me{font-size:clamp(20px,4vw,38px);font-weight:700;color:#ffd75e}
#cnt{font-size:clamp(13px,2vw,18px);color:#b9a3e6}
#v{position:fixed;bottom:3vh;left:50%;transform:translateX(-50%);padding:10px 22px;font:600 16px system-ui;color:#12091f;background:#ffd75e;border:0;border-radius:20px}
</style>
<script type="importmap">{"imports":{"three":"/three/three.module.js"}}</script>
</head>
<body><div id="hud"><div id="me">Connecting...</div><div id="cnt"></div></div><button id="v">Overview</button>
<script type="module">
import * as THREE from 'three';

const NAMES = ['Small Goblin', 'Goblin', 'Big Goblin', 'Goblin Wizard', 'GOBLIN KING'];
const SCALE = [0.7, 1, 1.35, 1.05, 1.25];
const SKIN = [0x86d65a, 0x5fbf3f, 0x3f8f2c, 0x4fbf9a, 0x9fd62a];

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x12091f);
const cam = new THREE.PerspectiveCamera(75, 1, 0.1, 150);
const R = 6, H = R, DOOR = 2.6, DH = 3.4, T = 0.25; // room = R-sized cube, doorway width/height
scene.add(new THREE.AmbientLight(0xb9a3ff, 0.9));
const wallMat = new THREE.MeshStandardMaterial({ color: 0x6b4fa8, roughness: 0.8 });
const ceilings = [];
const box = (w, h, d, x, y, z, mat) => { const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat); m.position.set(x, y, z); scene.add(m); return m; };
for (let i = 0; i < 9; i++) {
  const cx = ((i % 3) - 1) * R, cz = (Math.floor(i / 3) - 1) * R;
  box(R, T, R, cx, -T / 2, cz, new THREE.MeshStandardMaterial({ color: i === 4 ? 0x2a1646 : 0x3d2670, roughness: 0.6 }));
  ceilings.push(box(R, T, R, cx, H + T / 2, cz, new THREE.MeshStandardMaterial({ color: 0x2a1c4d })));
  const lamp = new THREE.PointLight(new THREE.Color().setHSL(0.72 + i * 0.03, 0.7, 0.7), 70, 0, 2);
  lamp.position.set(cx, H - 0.8, cz); scene.add(lamp);
  box(0.5, 0.15, 0.5, cx, H - 0.3, cz, new THREE.MeshBasicMaterial({ color: 0xffeeaa }));
}
// walls on every room boundary; interior ones get a doorway so all 9 cubes connect
for (let line = -1; line <= 2; line++) for (let k = 0; k < 3; k++) {
  const edge = (line - 0.5) * R, mid = (k - 1) * R, inner = line === 0 || line === 1;
  for (const vert of [false, true]) { // vert: wall at x=edge running along z, else wall at z=edge running along x
    const px = vert ? edge : mid, pz = vert ? mid : edge, w = vert ? T : R, d = vert ? R : T;
    if (!inner) { box(w, H, d, px, H / 2, pz, wallMat); continue; }
    const side = (R - DOOR) / 2, off = (DOOR + side) / 2;
    for (const sg of [-1, 1]) vert
      ? box(T, H, side, px, H / 2, pz + sg * off, wallMat)
      : box(side, H, T, px + sg * off, H / 2, pz, wallMat);
    box(w, H - DH, d, px, DH + (H - DH) / 2, pz, wallMat);
  }
}

const M = c => new THREE.MeshStandardMaterial({ color: c, roughness: 0.7 });
function mesh(geo, mat, x = 0, y = 0, z = 0) { const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); m.castShadow = true; return m; }

function makeGoblin(type) {
  const g = new THREE.Group(), skin = M(SKIN[type]);
  const body = mesh(new THREE.SphereGeometry(0.42, 20, 16), skin, 0, 0.45, 0); body.scale.set(1, 1.1, 0.9);
  const head = mesh(new THREE.SphereGeometry(0.34, 20, 16), skin, 0, 1.08, 0);
  g.add(body, head);
  for (const s of [-1, 1]) {
    const ear = mesh(new THREE.ConeGeometry(0.1, 0.5, 8), skin, s * 0.42, 1.15, 0); ear.rotation.z = -s * 1.2; g.add(ear);
    const eye = mesh(new THREE.SphereGeometry(0.08, 10, 8), M(0xffffff), s * 0.13, 1.14, 0.3);
    const pupil = mesh(new THREE.SphereGeometry(0.04, 8, 8), M(0x111111), s * 0.13, 1.14, 0.37);
    const leg = mesh(new THREE.SphereGeometry(0.14, 10, 8), skin, s * 0.2, 0.08, 0.1);
    g.add(eye, pupil, leg);
  }
  g.add(mesh(new THREE.ConeGeometry(0.06, 0.16, 6), skin, 0, 1.05, 0.34)); // nose
  if (type === 3) { // wizard hat + staff
    const hat = mesh(new THREE.ConeGeometry(0.36, 0.9, 16), M(0x5a2bb8), 0, 1.7, 0); hat.rotation.z = 0.15;
    const brim = mesh(new THREE.CylinderGeometry(0.5, 0.5, 0.05, 20), M(0x4a2398), 0, 1.3, 0);
    const staff = mesh(new THREE.CylinderGeometry(0.03, 0.03, 1.5, 8), M(0x7a5230), 0.6, 0.75, 0.2);
    const orb = mesh(new THREE.SphereGeometry(0.12, 12, 10), new THREE.MeshStandardMaterial({ color: 0x66ccff, emissive: 0x2299ff, emissiveIntensity: 1.5 }), 0.6, 1.55, 0.2);
    g.add(hat, brim, staff, orb);
  }
  if (type === 4) { // king: crown with gems + cape
    const gold = new THREE.MeshStandardMaterial({ color: 0xffc933, metalness: 0.8, roughness: 0.25 });
    const band = mesh(new THREE.CylinderGeometry(0.28, 0.3, 0.14, 16), gold, 0, 1.42, 0); g.add(band);
    for (let i = 0; i < 5; i++) {
      const a = i / 5 * Math.PI * 2;
      g.add(mesh(new THREE.ConeGeometry(0.07, 0.2, 6), gold, Math.sin(a) * 0.27, 1.6, Math.cos(a) * 0.27));
    }
    g.add(mesh(new THREE.SphereGeometry(0.06, 8, 8), new THREE.MeshStandardMaterial({ color: 0xff2244, emissive: 0xaa0022 }), 0, 1.45, 0.3));
    const cape = mesh(new THREE.BoxGeometry(0.7, 0.9, 0.06), M(0xb3122b), 0, 0.55, -0.4); cape.rotation.x = 0.12; g.add(cape);
  }
  g.scale.setScalar(SCALE[type] * 1.5);
  return g;
}

// state sync
const actors = new Map(); // id -> {group, base, t0}
let me = 0;
const ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host);
ws.onmessage = e => {
  const d = JSON.parse(e.data);
  if (d.you) me = d.you;
  if (!d.players) return;
  const ids = new Set(d.players.map(p => p.id));
  for (const [id, a] of actors) if (!ids.has(id)) { scene.remove(a.group); actors.delete(id); }
  for (const p of d.players) if (!actors.has(p.id)) {
    const group = makeGoblin(p.goblin);
    scene.add(group);
    actors.set(p.id, { group, box: p.box, goblin: p.goblin, t0: performance.now() });
  }
  for (const p of d.players) {
    const a = actors.get(p.id), ang = p.id * 2.4; // stable ring position per player, same on every client
    a.box = p.box;
    a.base = new THREE.Vector3(((p.box % 3) - 1) * R + Math.cos(ang) * 1.8, 0, (Math.floor(p.box / 3) - 1) * R + Math.sin(ang) * 1.8);
  }
  const mine = d.players.find(p => p.id === me);
  document.getElementById('me').textContent = mine ? 'You are: ' + NAMES[mine.goblin] : 'Connecting...';
  document.getElementById('cnt').textContent = 'Goblin King  ·  ' + d.players.length + ' online';
};

function resize() { renderer.setSize(innerWidth, innerHeight); cam.aspect = innerWidth / innerHeight; cam.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();

// look around (inside) or orbit (overview) by dragging
let inside = true, yaw = 0, pitch = 0, orbit = 0, drag = null, aimed = false;
const vbtn = document.getElementById('v');
const toggle = () => { inside = !inside; vbtn.textContent = inside ? 'Overview' : 'Go inside'; };
vbtn.onclick = toggle; vbtn.onpointerdown = e => e.stopPropagation();
addEventListener('keydown', e => e.key === 'v' && toggle());
addEventListener('pointerdown', e => drag = e);
addEventListener('pointerup', () => drag = null);
addEventListener('pointermove', e => {
  if (!drag) return;
  const dx = e.clientX - drag.clientX, dy = e.clientY - drag.clientY; drag = e;
  if (inside) { yaw -= dx * 0.005; pitch = Math.max(-1.2, Math.min(1.2, pitch - dy * 0.005)); } else orbit -= dx * 0.006;
});
cam.rotation.order = 'YXZ';

renderer.setAnimationLoop(now => {
  const mine = actors.get(me);
  if (mine && mine.base && !aimed) { // face the middle of your cube at the start
    const cx = ((mine.box % 3) - 1) * R, cz = (Math.floor(mine.box / 3) - 1) * R;
    yaw = Math.atan2(-(cx - mine.base.x), -(cz - mine.base.z)); aimed = true;
  }
  for (const [id, a] of actors) {
    if (!a.base) continue;
    const age = Math.min((now - a.t0) / 600, 1), pop = 1 - Math.pow(1 - age, 3);
    a.group.position.set(a.base.x, (1 - pop) * 4 + Math.abs(Math.sin(now / 350 + id)) * 0.08, a.base.z);
    a.group.rotation.y = Math.atan2(-a.base.x + ((a.box % 3) - 1) * R, -a.base.z + (Math.floor(a.box / 3) - 1) * R) + Math.PI;
    a.group.visible = !(inside && id === me);
  }
  wallMat.transparent = !inside; wallMat.opacity = inside ? 1 : 0.22; wallMat.depthWrite = inside; wallMat.needsUpdate = true;
  ceilings.forEach(c => c.visible = inside);
  if (inside && mine && mine.base) {
    cam.fov = 75; cam.position.set(mine.base.x, 2.4, mine.base.z); cam.rotation.set(pitch, yaw, 0);
  } else {
    const dist = innerHeight > innerWidth ? 34 : 26;
    cam.fov = 45; cam.position.set(Math.sin(orbit + 0.3) * dist, dist * 0.75, Math.cos(orbit + 0.3) * dist); cam.lookAt(0, 2, 0);
  }
  cam.updateProjectionMatrix();
  renderer.render(scene, cam);
});
</script></body></html>
